version: '3.8'

services:
  edupredict:
    build: .
    container_name: edupredict_app
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=edupredict-production-secret-2026
      - PORT=5000
    volumes:
      - ./backend/edupredict.db:/app/backend/edupredict.db
    restart: unless-stopped
