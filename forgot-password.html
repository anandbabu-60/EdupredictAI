<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduPredict AI — Reset Password">
  <title>Forgot Password — EduPredict AI</title>
  
  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <span>EduPredict<span class="highlight">AI</span></span>
        </a>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Enter your registered email and choose a new password</p>
      </div>

      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="forgotEmail" class="form-label">Registered Email Address <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="forgotEmail" class="form-control" placeholder="name@university.edu" required autocomplete="email">
          </div>
          <div class="invalid-feedback">Please enter a valid registered email address.</div>
        </div>

        <div class="form-group">
          <label for="forgotNewPassword" class="form-label">New Password <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="forgotNewPassword" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password">
            <button type="button" class="input-action-btn" data-action="toggle-password" data-target="forgotNewPassword" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">New password must be at least 6 characters.</div>
        </div>

        <div class="form-group">
          <label for="forgotConfirmPassword" class="form-label">Confirm New Password <span class="required">*</span></label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="forgotConfirmPassword" class="form-control" placeholder="Re-enter new password" required autocomplete="new-password">
            <button type="button" class="input-action-btn" data-action="toggle-password" data-target="forgotConfirmPassword" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Passwords must match.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotSubmitBtn">
          <i class="fa-solid fa-key"></i> Update Password
        </button>
      </form>

      <div class="auth-footer" style="margin-top: 1.5rem;">
        Remember your password? <a href="login.html">Return to Login</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js?v=2.2"></script>
  <script src="js/app.js?v=2.2"></script>
  <script src="js/auth.js?v=2.2"></script>
</body>
</html>
